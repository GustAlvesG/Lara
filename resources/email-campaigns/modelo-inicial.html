<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clube dos Funcionários</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f1ee;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f1ee;">
  <tr>
    <td align="center" style="padding:24px 12px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background-color:#ffffff;border-radius:12px;overflow:hidden;">
        <tr>
          <td style="background-color:#a00001;padding:28px 32px;font-family:Arial,Helvetica,sans-serif;color:#ffffff;">
            <p style="margin:0;font-size:13px;letter-spacing:1px;text-transform:uppercase;opacity:.85;">Clube dos Funcionários</p>
            <h1 style="margin:6px 0 0;font-size:26px;line-height:1.25;font-weight:bold;">Título do e-mail</h1>
          </td>
        </tr>
        <tr>
          <td style="padding:32px;font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.6;color:#2b2523;">
            <p style="margin:0 0 16px;">Olá, {{primeiro_nome}}!</p>
            <p style="margin:0 0 16px;">Escreva aqui a mensagem. Troque o título, os textos e o botão; apague o que não for usar.</p>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
              <tr>
                <td style="background-color:#a00001;border-radius:999px;">
                  <a href="https://www.exemplo.com.br" style="display:inline-block;padding:14px 28px;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:bold;color:#ffffff;text-decoration:none;">Saiba mais</a>
                </td>
              </tr>
            </table>
            <p style="margin:0;">Até breve,<br>Equipe do Clube</p>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px;background-color:#faf8f6;border-top:1px solid #ece6e1;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#7a6f6a;">
            Você recebeu este e-mail em {{email}}. Para não receber mais, responda com a palavra DESCADASTRAR.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
